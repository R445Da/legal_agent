<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>آرشیو هوشمند پرونده — کنسول</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ccircle cx='50' cy='50' r='50' fill='%23142236'/%3E%3Cg stroke='%23C6A44E' stroke-width='4' fill='none' stroke-linecap='round' stroke-linejoin='round'%3E%3Cline x1='50' y1='24' x2='50' y2='72'/%3E%3Cline x1='30' y1='32' x2='70' y2='32'/%3E%3Cline x1='30' y1='32' x2='20' y2='50'/%3E%3Cline x1='30' y1='32' x2='40' y2='50'/%3E%3Cpath d='M18 50a12 7 0 0 0 24 0'/%3E%3Cline x1='70' y1='32' x2='60' y2='50'/%3E%3Cline x1='70' y1='32' x2='80' y2='50'/%3E%3Cpath d='M58 50a12 7 0 0 0 24 0'/%3E%3Cline x1='38' y1='76' x2='62' y2='76'/%3E%3Ccircle cx='50' cy='24' r='4' fill='%23C6A44E' stroke='none'/%3E%3C/g%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#142236; --ink-soft:#44506B;
  --paper:#F3F0E7; --surface:#FFFFFF;
  --line:#E1DAC7;
  --stamp-red:#7C2D2D; --stamp-red-soft:#F2E1DC;
  --teal:#0F4C3A; --teal-soft:#DCEAE1;
  --amber:#9C7209; --amber-soft:#F2E6C9;
  --gray:#6E6858; --gray-soft:#EAE5D8;
  --gold:#A9812E; --gold-soft:#F2E9D3;
  --radius:12px;
  --shadow:0 1px 2px rgba(20,34,54,.05), 0 8px 24px -10px rgba(20,34,54,.14);
}
*{box-sizing:border-box;}
html,body{margin:0;height:100%;}
body{font-family:'Vazirmatn',Tahoma,sans-serif;background:var(--paper);color:var(--ink);font-size:14.3px;line-height:1.75;}
.mono{font-family:'IBM Plex Mono','Vazirmatn',monospace;}
button{font-family:inherit;cursor:pointer;}
select,input,textarea{font-family:inherit;}
::selection{background:var(--stamp-red-soft);}
a{color:var(--teal);}

/* ---------- shell ---------- */
.shell{display:flex;height:100vh;overflow:hidden;}
.sidebar{width:238px;flex:none;background:var(--ink);color:#EDEFEA;display:flex;flex-direction:column;}
.brand{padding:20px 18px 14px;border-bottom:1px solid rgba(255,255,255,.08);display:flex;align-items:center;gap:10px;}
.brand-mark{width:36px;height:36px;flex:none;display:flex;align-items:center;justify-content:center;}
.brand-title{font-weight:800;font-size:14.8px;}
.brand-sub{font-size:10.5px;color:#94A69A;font-family:'IBM Plex Mono';letter-spacing:.5px;margin-top:2px;}
.nav{padding:12px 10px;flex:1;overflow-y:auto;}
.nav-label{font-size:10.3px;color:#7C8B80;letter-spacing:.5px;padding:12px 12px 6px;font-family:'IBM Plex Mono';}
.nav-item{display:flex;align-items:center;gap:9px;padding:9px 12px;margin-bottom:3px;border-radius:8px;color:#C9D0C5;font-size:13.3px;font-weight:500;border-inline-start:3px solid transparent;transition:background .15s;}
.nav-item .n{font-family:'IBM Plex Mono';font-size:10.5px;color:#7C8B80;width:16px;}
.nav-item:hover{background:rgba(255,255,255,.05);color:#fff;cursor:pointer;}
.nav-item.active{background:rgba(255,255,255,.08);color:#fff;border-inline-start-color:var(--gold);}
.nav-item .badge{margin-inline-start:auto;background:var(--stamp-red);color:#fff;font-size:10px;font-family:'IBM Plex Mono';border-radius:10px;padding:1px 6px;}
.sidebar-foot{padding:12px 18px;border-top:1px solid rgba(255,255,255,.08);font-size:11px;color:#8A9A8F;line-height:1.8;}
.sidebar-foot .ok{color:#8FC9AE;} .sidebar-foot .bad{color:#E7A6A0;} .sidebar-foot .m{color:#D8C9A0;}

.main{flex:1;display:flex;flex-direction:column;min-width:0;}
.scroll-area{flex:1;min-height:0;overflow-y:auto;overflow-x:hidden;}

/* ---------- topbar ---------- */
.topbar{height:60px;flex:none;background:var(--surface);border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 20px;gap:14px;position:relative;z-index:6;}
.tb-search{display:flex;align-items:center;gap:8px;background:var(--paper);border:1px solid var(--line);border-radius:9px;padding:7px 12px;width:280px;color:var(--gray);}
.tb-search input{border:none;background:transparent;outline:none;flex:1;font-size:13px;color:var(--ink);}
.tb-right{display:flex;align-items:center;gap:10px;}
.model-pick{display:flex;align-items:center;gap:7px;background:var(--paper);border:1px solid var(--line);border-radius:9px;padding:5px 10px;max-width:280px;}
.model-pick .lbl{font-size:10px;color:var(--gray);font-family:'IBM Plex Mono';letter-spacing:.4px;white-space:nowrap;}
.model-pick select{border:none;background:transparent;outline:none;font-size:12.3px;color:var(--ink);font-weight:600;max-width:190px;cursor:pointer;}
.model-pick.busy{opacity:.55;}
.icon-btn{width:34px;height:34px;border-radius:9px;border:1px solid var(--line);display:flex;align-items:center;justify-content:center;color:var(--ink-soft);font-size:15px;background:#fff;}
.icon-btn:hover{background:var(--paper);}
.avatar{width:30px;height:30px;border-radius:50%;background:var(--teal-soft);color:var(--teal);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:12px;flex:none;}

.view{padding:24px 28px 60px;max-width:1180px;margin:0 auto;width:100%;}
.view-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px;flex-wrap:wrap;gap:12px;}
.view-title{font-size:19px;font-weight:800;}
.view-sub{color:var(--gray);font-size:12.6px;margin-top:2px;}
.btn{border:1px solid var(--ink);background:var(--ink);color:#fff;padding:9px 16px;border-radius:8px;font-size:12.6px;font-weight:600;}
.btn.ghost{background:transparent;color:var(--ink);border-color:var(--line);}
.btn.teal{background:var(--teal);border-color:var(--teal);}
.btn.sm{padding:6px 12px;font-size:11.6px;}
.btn:disabled{opacity:.5;cursor:default;}
.btn:not(:disabled):hover{opacity:.9;}

/* ---------- case id / stamps ---------- */
.case-id{display:inline-flex;gap:3px;direction:ltr;unicode-bidi:isolate;flex-wrap:wrap;}
.case-id .d{font-family:'IBM Plex Mono';font-weight:600;font-size:12px;min-width:16px;height:19px;padding:0 2px;display:flex;align-items:center;justify-content:center;border:1px solid var(--line);border-radius:2px;background:#fff;color:var(--ink-soft);}
.case-id.lg .d{min-width:20px;height:24px;font-size:14px;}
.case-id.none{direction:rtl;} .case-id.none .d{border-style:dashed;color:var(--gray);}
.stamp{display:inline-flex;align-items:center;gap:6px;padding:4px 11px 4px 9px;border-radius:20px;font-size:11.3px;font-weight:700;border:1.5px dashed currentColor;white-space:nowrap;}
.stamp .dotc{width:6px;height:6px;border-radius:50%;background:currentColor;flex:none;}
.stamp.teal{color:var(--teal);background:var(--teal-soft);}
.stamp.gray{color:var(--gray);background:var(--gray-soft);}
.stamp.review{color:var(--amber);background:var(--amber-soft);}
.stamp.red{color:var(--stamp-red);background:var(--stamp-red-soft);}
.chip{display:inline-flex;align-items:center;padding:3px 10px;border-radius:14px;background:var(--gray-soft);color:var(--ink-soft);font-size:11px;font-weight:600;cursor:pointer;}
.chip:hover{background:var(--teal-soft);color:var(--teal);}

/* ---------- ledger / panel / table ---------- */
.ledger-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:22px;}
.ledger-card{background:var(--surface);border:1px solid var(--line);border-top:3px dashed var(--line);border-radius:var(--radius);padding:15px 17px;box-shadow:var(--shadow);}
.ledger-card .num{font-family:'IBM Plex Mono';font-size:25px;font-weight:600;line-height:1;}
.ledger-card .lbl{color:var(--gray);font-size:12px;margin-top:8px;}
.ledger-card.accent-red{border-top-color:var(--stamp-red);} .ledger-card.accent-red .num{color:var(--stamp-red);}
.ledger-card.accent-teal{border-top-color:var(--teal);} .ledger-card.accent-teal .num{color:var(--teal);}
.ledger-card.accent-amber{border-top-color:var(--amber);} .ledger-card.accent-amber .num{color:var(--amber);}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);margin-bottom:18px;box-shadow:var(--shadow);}
.panel-head{padding:14px 17px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;gap:10px;}
.panel-head h3{margin:0;font-size:14px;font-weight:700;}
.panel-head .sub{font-size:11.6px;color:var(--gray);}
.panel-body{padding:6px 17px 12px;}
.table-wrap{overflow-x:auto;}
table{width:100%;border-collapse:collapse;}
th{text-align:right;font-size:10.8px;color:var(--gray);font-weight:600;padding:9px 7px;border-bottom:1px solid var(--line);white-space:nowrap;}
td{padding:11px 7px;border-bottom:1px solid #EEEADD;font-size:13px;vertical-align:middle;}
tr.row-hover:hover{background:var(--paper);cursor:pointer;}
.case-sub{color:var(--gray);font-size:11.5px;margin-top:2px;font-weight:400;}
.list-row{display:flex;align-items:center;justify-content:space-between;padding:11px 0;border-bottom:1px solid #EEEADD;gap:10px;}
.list-row:last-child{border-bottom:none;}
.chips{display:flex;flex-wrap:wrap;gap:6px;}
.disclaimer{background:var(--amber-soft);color:#7A5305;border:1px dashed var(--amber);border-radius:8px;padding:11px 14px;font-size:12px;margin-bottom:14px;}
.soon{background:var(--gray-soft);color:var(--ink-soft);border:1px dashed var(--gray);border-radius:8px;padding:13px 15px;font-size:12.3px;}

/* ---------- case detail ---------- */
.case-cover{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:20px 22px;box-shadow:var(--shadow);}
.case-cover-top{display:flex;justify-content:space-between;align-items:flex-start;gap:14px;flex-wrap:wrap;}
.case-cover h2{margin:8px 0 6px;font-size:18.5px;font-weight:800;}
.case-meta{display:flex;flex-wrap:wrap;gap:16px;margin-top:12px;color:var(--ink-soft);font-size:12.4px;}
.case-meta b{color:var(--ink);font-weight:700;}
.folder-tabs{display:flex;gap:2px;margin-top:14px;border-bottom:1px solid var(--line);flex-wrap:wrap;}
.folder-tab{padding:9px 15px;font-size:12.6px;font-weight:600;color:var(--gray);border:1px solid transparent;border-bottom:none;border-radius:8px 8px 0 0;position:relative;top:1px;cursor:pointer;}
.folder-tab.active{color:var(--ink);background:var(--surface);border-color:var(--line);border-bottom:1px solid var(--surface);}
.tab-panel{background:var(--surface);border:1px solid var(--line);border-top:none;border-radius:0 0 var(--radius) var(--radius);padding:20px;margin-bottom:22px;box-shadow:var(--shadow);}
.tab-panel h4:first-child{margin-top:0;}
.tl-item{display:flex;gap:14px;position:relative;padding-bottom:20px;}
.tl-item:last-child{padding-bottom:0;}
.tl-item::before{content:"";position:absolute;top:22px;bottom:-4px;right:14.5px;width:1px;background:var(--line);}
.tl-item:last-child::before{display:none;}
.tl-dot{width:30px;height:30px;border-radius:50%;flex:none;display:flex;align-items:center;justify-content:center;border:2px solid var(--teal);color:var(--teal);background:var(--teal-soft);font-size:13px;z-index:1;}
.tl-date{font-family:'IBM Plex Mono';font-size:11.3px;color:var(--gray);margin-bottom:2px;}
.tl-title{font-weight:700;font-size:13.3px;}
.tl-src{color:var(--gray);font-size:10.8px;margin-top:5px;}
.doc-row{display:flex;align-items:center;gap:13px;padding:12px 4px;border-bottom:1px solid #EEEADD;}
.doc-row:last-child{border-bottom:none;}
.doc-icon{width:36px;height:36px;border-radius:6px;background:var(--paper);border:1px solid var(--line);display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:700;color:var(--ink-soft);flex:none;}
.doc-name{font-weight:600;font-size:13.1px;}
.doc-meta{color:var(--gray);font-size:11.3px;margin-top:2px;}
.doc-right{margin-inline-start:auto;}

/* similar / results */
.sim-row{padding:13px 4px;border-bottom:1px solid #EEEADD;}
.sim-row:last-child{border-bottom:none;}
.sim-top{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:7px;}
.bar-track{height:6px;border-radius:4px;background:var(--gray-soft);overflow:hidden;}
.bar-fill{height:100%;background:var(--teal);border-radius:4px;}
.sim-pct{font-family:'IBM Plex Mono';font-weight:700;font-size:12.3px;}

/* forms */
textarea.field,input.field,select.field{width:100%;border:1px solid var(--line);border-radius:8px;padding:10px 12px;font-size:13px;color:var(--ink);background:#fff;outline:none;resize:vertical;}
textarea.field:focus,input.field:focus,select.field:focus{border-color:var(--teal);}
.field-row{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-top:12px;}
label.lbl{font-size:11.5px;color:var(--gray);display:block;margin-bottom:5px;}

/* answer / citations */
.answer{background:var(--paper);border:1px solid var(--line);border-radius:8px;padding:15px 17px;font-size:13.8px;line-height:2;white-space:pre-wrap;}
.cite{display:inline-flex;min-width:18px;height:18px;padding:0 4px;align-items:center;justify-content:center;background:var(--teal-soft);color:var(--teal);border-radius:4px;font-family:'IBM Plex Mono';font-size:11px;font-weight:700;cursor:pointer;vertical-align:1px;}
.ctx-card{border:1px solid var(--line);border-radius:8px;padding:12px 14px;margin-top:10px;background:var(--surface);}
.fb{margin-inline-start:8px;white-space:nowrap;}
.fb-b{border:1px solid var(--line);background:#fff;border-radius:6px;padding:1px 5px;font-size:11px;line-height:1.4;filter:grayscale(1);opacity:.6;}
.fb-b:hover{opacity:1;filter:none;}
.fb-b.on{filter:none;opacity:1;border-color:var(--teal);background:var(--teal-soft);}
.ctx-card.flash{animation:flash 1.1s ease;}
@keyframes flash{0%,100%{background:var(--surface);}25%{background:var(--teal-soft);}}
.ctx-num{font-family:'IBM Plex Mono';font-weight:700;color:var(--teal);font-size:12px;}
.ctx-src{color:var(--gray);font-size:11.3px;}
.ctx-text{font-size:12.3px;color:var(--ink-soft);margin-top:6px;max-height:120px;overflow:auto;}

/* states */
.state{padding:40px 20px;text-align:center;color:var(--gray);font-size:13px;}
.spinner{width:22px;height:22px;border:2px solid var(--line);border-top-color:var(--teal);border-radius:50%;display:inline-block;animation:spin .8s linear infinite;}
@keyframes spin{to{transform:rotate(360deg);}}
.err{background:var(--stamp-red-soft);color:var(--stamp-red);border:1px solid var(--stamp-red);border-radius:8px;padding:12px 14px;font-size:12.6px;}

/* pipeline */
.pipe-step{display:flex;align-items:center;gap:12px;padding:9px 0;opacity:.4;transition:opacity .3s;}
.pipe-step.active{opacity:1;}
.pipe-step.done .pipe-icon{background:var(--teal);color:#fff;border-color:var(--teal);}
.pipe-icon{width:25px;height:25px;border-radius:50%;border:2px solid var(--line);display:flex;align-items:center;justify-content:center;font-size:11.5px;flex:none;color:var(--gray);}
.pipe-label{font-size:12.8px;font-weight:600;}
.pipe-sub{font-size:11px;color:var(--gray);}

/* ---------- agent chat ---------- */
.agent-wrap{flex:1;display:flex;flex-direction:column;min-height:0;}
.agent-head{height:60px;flex:none;background:var(--surface);border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 20px;gap:12px;}
.ah-left{display:flex;align-items:center;gap:11px;}
.ah-av{width:34px;height:34px;border-radius:50%;background:var(--teal-soft);color:var(--teal);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:13px;position:relative;flex:none;}
.ah-dot{position:absolute;bottom:-1px;left:-1px;width:10px;height:10px;border-radius:50%;background:var(--gray);border:2px solid var(--surface);}
.ah-dot.live{background:var(--teal);} .ah-dot.busy{background:var(--amber);}
.ah-name{font-weight:800;font-size:14px;}
.ah-state{font-size:11px;color:var(--gray);}
.chat-scroll{flex:1;overflow-y:auto;padding:22px 0 8px;}
.chat-inner{max-width:760px;margin:0 auto;padding:0 22px;}
.msg{display:flex;margin-bottom:14px;}
.bubble{max-width:82%;padding:12px 15px;border-radius:16px;font-size:13.5px;line-height:1.9;}
.msg.user .bubble{background:var(--ink);color:#F3F4F1;border-bottom-left-radius:5px;margin-inline-end:auto;}
.msg.bot .bubble{background:var(--surface);border:1px solid var(--line);color:var(--ink);border-bottom-right-radius:5px;margin-inline-start:auto;}
.bubble.wide{max-width:92%;padding:15px 17px;}
.bot-tag{display:flex;align-items:center;gap:7px;margin-bottom:8px;justify-content:flex-end;color:var(--gray);font-size:10.4px;font-weight:600;}
.typing{display:flex;gap:4px;padding:4px 0;}
.typing i{width:6px;height:6px;border-radius:50%;background:var(--gray);animation:blink 1.2s infinite;}
.typing i:nth-child(2){animation-delay:.2s;} .typing i:nth-child(3){animation-delay:.4s;}
@keyframes blink{0%,80%,100%{opacity:.25;}40%{opacity:1;}}
.card-title{font-weight:700;font-size:12.8px;margin-bottom:8px;display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;}
.intent-badge{display:inline-flex;align-items:center;gap:6px;padding:3px 10px;border-radius:14px;font-size:11px;font-weight:700;border:1.5px solid currentColor;margin-bottom:9px;}
.intent-badge.query{color:var(--teal);background:var(--teal-soft);}
.intent-badge.archive{color:var(--amber);background:var(--amber-soft);}
.intent-badge.analytics{color:var(--ink-soft);background:var(--gray-soft);}
.steps{margin:8px 0;border:1px solid var(--line);border-radius:8px;overflow:hidden;}
.steps summary{cursor:pointer;padding:7px 11px;font-size:11px;font-weight:600;color:var(--ink-soft);background:var(--paper);list-style:none;}
.steps summary::-webkit-details-marker{display:none;}
.steps summary::before{content:"▸ ";color:var(--gray);}
.steps[open] summary::before{content:"▾ ";}
.step{display:flex;gap:10px;padding:8px 11px;border-top:1px solid var(--line);font-size:11.4px;}
.step .si{width:18px;height:18px;border-radius:50%;background:var(--teal);color:#fff;display:flex;align-items:center;justify-content:center;font-size:10px;flex:none;}
.step .sn{font-weight:700;}
.step .sd{color:var(--gray);font-size:10.8px;margin-top:2px;line-height:1.7;}
.step .sms{margin-inline-start:auto;color:var(--gray);font-family:'IBM Plex Mono';font-size:10px;white-space:nowrap;}
.gf-field{margin-bottom:10px;}
.gf-field label{display:flex;align-items:baseline;gap:6px;font-size:11.5px;color:var(--ink-soft);margin-bottom:4px;font-weight:600;}
.gf-field .miss{color:var(--stamp-red);font-size:10px;font-weight:700;}
.gf-field .help{color:var(--gray);font-size:10px;font-weight:400;}
.gf-field input,.gf-field textarea,.gf-field select{width:100%;border:1px solid var(--line);border-radius:7px;padding:7px 9px;font-family:inherit;font-size:12.3px;background:#fff;}
.gf-field.missing input,.gf-field.missing textarea{border-color:var(--amber);background:var(--amber-soft);}
.gf-list-row{display:flex;gap:6px;margin-bottom:5px;}
.gf-list-row input,.gf-list-row select{flex:1;}
.gf-x{border:1px solid var(--line);background:#fff;border-radius:6px;width:28px;flex:none;color:var(--stamp-red);}
.ftable{width:100%;border-collapse:collapse;margin-top:6px;}
.ftable td{padding:6px 4px;font-size:12.2px;border-bottom:1px solid #EEEADD;vertical-align:top;}
.ftable td:first-child{color:var(--gray);width:32%;}
.card-actions{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap;}
.confirmed{color:var(--teal);font-size:11.4px;font-weight:700;margin-top:9px;display:none;}
.confirmed.show{display:block;}
.suggestions{max-width:760px;margin:0 auto 6px;padding:0 22px;display:flex;gap:8px;flex-wrap:wrap;}
.chipbtn{border:1px solid var(--line);background:var(--surface);padding:8px 13px;border-radius:20px;font-size:11.5px;color:var(--ink-soft);white-space:nowrap;}
.chipbtn:hover{border-color:var(--teal);color:var(--teal);}
.composer-wrap{flex:none;padding:6px 22px 16px;background:linear-gradient(180deg,rgba(243,240,231,0),var(--paper) 45%);}
.composer{max-width:760px;margin:0 auto;background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:7px 7px 7px 13px;display:flex;align-items:flex-end;gap:7px;box-shadow:0 4px 18px -6px rgba(20,34,54,.15);}
.composer textarea{flex:1;border:none;outline:none;resize:none;font-family:inherit;font-size:13.5px;padding:8px 4px;max-height:120px;background:transparent;color:var(--ink);}
.cbtn{width:36px;height:36px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:var(--ink-soft);font-size:15px;flex:none;border:none;background:none;}
.cbtn.mic{border:1.5px solid var(--line);}
.cbtn.mic.listening{background:var(--stamp-red);color:#fff;border-color:var(--stamp-red);animation:micpulse 1.3s infinite;}
@keyframes micpulse{0%{box-shadow:0 0 0 0 rgba(124,45,45,.4);}70%{box-shadow:0 0 0 9px rgba(124,45,45,0);}100%{box-shadow:0 0 0 0 rgba(124,45,45,0);}}
.rec-bar{display:none;max-width:760px;margin:0 auto 8px;align-items:center;gap:12px;background:var(--surface);border:1px solid var(--stamp-red);border-radius:16px;padding:8px 12px;}
.rec-bar.on{display:flex;}
.rec-stop{border:1px solid var(--stamp-red);background:var(--stamp-red-soft);color:var(--stamp-red);border-radius:10px;padding:5px 12px;font-size:11.5px;font-weight:700;flex:none;}
.rec-eq{flex:1;display:flex;align-items:center;gap:2px;height:26px;overflow:hidden;}
.rec-eq i{flex:1;min-width:2px;height:3px;background:var(--stamp-red);border-radius:2px;transition:height .08s linear;opacity:.85;}
.rec-status{font-size:11px;color:var(--gray);flex:none;min-width:120px;text-align:center;}
.rec-status.speaking{color:var(--teal);font-weight:700;}
.rec-status.silence{color:var(--amber);}
.cbtn.send{background:var(--ink);color:#fff;}
.hint{max-width:760px;margin:6px auto 0;padding:0 26px;font-size:10.4px;color:var(--gray);text-align:center;}

/* ---------- taxonomy ---------- */
.tax-cat{margin-bottom:16px;}
.tax-name{font-weight:800;font-size:13.5px;margin-bottom:8px;display:flex;align-items:center;gap:8px;}
.tax-name .mono{color:var(--gray);font-size:10.5px;font-weight:500;}
.tax-leaf{display:inline-flex;align-items:center;gap:6px;padding:6px 12px;border:1px solid var(--line);border-radius:16px;font-size:12px;margin:0 4px 6px 0;background:#fff;cursor:pointer;}
.tax-leaf:hover{border-color:var(--teal);color:var(--teal);}
.tax-leaf .cnt{font-family:'IBM Plex Mono';color:var(--gray);font-size:10.5px;}

/* overlay */
.overlay{position:fixed;inset:0;background:rgba(20,34,54,.45);display:none;align-items:center;justify-content:center;z-index:50;padding:20px;}
.overlay.show{display:flex;}
.modal{background:#fff;border-radius:12px;width:560px;max-width:100%;max-height:88vh;overflow:auto;box-shadow:0 20px 60px rgba(0,0,0,.25);}
.modal-head{padding:16px 20px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;}
.modal-head h3{margin:0;font-size:14.5px;font-weight:800;}
.modal-close{color:var(--gray);font-size:20px;line-height:1;background:none;border:none;}
.modal-body{padding:18px 20px 22px;}

@media(max-width:900px){
  .ledger-grid{grid-template-columns:repeat(2,1fr);}
  .sidebar{width:70px;}
  .brand-title,.brand-sub,.nav-item span:not(.n):not(.badge),.nav-label,.sidebar-foot{display:none;}
  .tb-search{width:130px;}
  .model-pick .lbl{display:none;}
}
</style>

  <div class="sidebar">
    <div class="brand">

            <line x1="70" y1="32" x2="60" y2="50"/><line x1="70" y1="32" x2="80" y2="50"/>
            <path d="M58 50a12 7 0 0 0 24 0"/><line x1="38" y1="76" x2="62" y2="76"/>
            <circle cx="50" cy="24" r="3.4" fill="#C6A44E" stroke="none"/>
          </g>
        </svg>
      </span>
      <div><div class="brand-title">آرشیو هوشمند پرونده</div><div class="brand-sub">CASE&nbsp;INTELLIGENCE</div></div>

</div>

<div class="overlay" id="settingsOverlay">
  <div class="modal" style="width:440px;">
    <div class="modal-head"><h3>اتصال به سرور</h3><button class="modal-close" onclick="closeOverlay('settingsOverlay')">✕</button></div>
    <div class="modal-body">
      <label class="lbl">آدرس سرور</label>
      <input class="field" id="cfgUrl" placeholder="http://localhost:8000" dir="ltr">

      <input class="field" id="cfgToken" type="password" placeholder="Bearer token" dir="ltr">
      <div class="field-row" style="justify-content:flex-end;">
        <button class="btn ghost" onclick="closeOverlay('settingsOverlay')">انصراف</button>
        <button class="btn" onclick="saveSettings()">ذخیره و بررسی</button>
      </div>
      <div id="cfgMsg" style="font-size:12px;color:var(--gray);margin-top:10px;"></div>

</div>

<div class="overlay" id="ingestOverlay">
  <div class="modal">
    <div class="modal-head"><h3>پردازش و بایگانی سند</h3><button class="modal-close" onclick="closeOverlay('ingestOverlay')">✕</button></div>
    <div class="modal-body" id="ingestModalBody"></div>
  </div>
</div>

<div class="overlay" id="reportOverlay">
  <div class="modal" style="width:640px;">
    <div class="modal-head"><h3>گزارش پرونده</h3><button class="modal-close" onclick="closeOverlay('reportOverlay')">✕</button></div>
    <div class="modal-body" id="reportModalBody"></div>
  </div>
</div>

<div class="overlay" id="docOverlay">
  <div class="modal" style="width:720px;">
    <div class="modal-head"><h3 id="docModalTitle">سند</h3><button class="modal-close" onclick="closeOverlay('docOverlay')">✕</button></div>
    <div class="modal-body" id="docModalBody"></div>
  </div>

<script>
/* ===================== config + api ===================== */
const CFG = {
  get url(){ try{ return localStorage.getItem("rag.url") || location.origin; }catch(e){ return location.origin; } },
  get token(){ try{ return localStorage.getItem("rag.token") || ""; }catch(e){ return ""; } },
  get model(){ try{ return localStorage.getItem("rag.model") || ""; }catch(e){ return ""; } },
  set model(v){ try{ v ? localStorage.setItem("rag.model", v) : localStorage.removeItem("rag.model"); }catch(e){} },
  save(u,t){ try{ localStorage.setItem("rag.url", (u||location.origin).replace(/\/+$/,"")); localStorage.setItem("rag.token", t||""); }catch(e){} },
};
async function api(path, {method="GET", body=null}={}){
  const headers = {"ngrok-skip-browser-warning":"true"};
  if(body) headers["Content-Type"] = "application/json";
  if(CFG.token) headers["Authorization"] = "Bearer " + CFG.token;
  const r = await fetch(CFG.url + path, {method, headers, body: body ? JSON.stringify(body) : undefined});
  const txt = await r.text();
  let data; try{ data = txt ? JSON.parse(txt) : null; }catch(_){ data = txt; }
  if(!r.ok){
    const detail = (data && data.detail) ? data.detail : (typeof data === "string" ? data : r.statusText);
    throw new Error(`${r.status} · ${detail}`);
  }
  return data;
}
const withModel = b => CFG.model ? {...b, model: CFG.model} : b;

/* ===================== helpers ===================== */
const $ = s => document.querySelector(s);
const mainRoot = () => $("#mainRoot");
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const faNum = n => Number(n||0).toLocaleString("fa-IR");
const md = s => esc(s).replace(/\*\*(.+?)\*\*/g,"<b>$1</b>");
const ROLE_FA = {khahan:"خواهان",khande:"خوانده",vakil_khahan:"وکیل خواهان",vakil_khande:"وکیل خوانده",ghazi:"قاضی",mottaham:"متهم",shaki:"شاکی",other:"—"};
function caseIdHTML(num, size){
  let s = String(num || "").trim();
  const cls = (size === "lg" ? "case-id lg" : "case-id");
  const digits = (s.match(/[0-9۰-۹]/g) || []).length;
  const looksLikeNumber = s && s.length <= 24 && digits >= 4 && digits / s.length > 0.5;
  if(!looksLikeNumber){
    const label = s ? (s.length > 22 ? s.slice(0,22) + "…" : s) : "بدون شماره";
    return `<span class="${cls} none"><span class="d">${esc(label)}</span></span>`;
  }
  return `<span class="${cls}">` + s.split("").map(ch => /[\s\/-]/.test(ch) ? "" : `<span class="d">${esc(ch)}</span>`).join("") + `</span>`;
}
const docBasename = src => String(src || "").split("/").pop() || src || "—";

/* ===================== state ===================== */
const S = { health:null, stats:null, entries:null, cases:[], models:[], modelCurrent:null, collections:[], error:null, loading:true };
let activeView = "agent";
let searchTerm = "", taxFilter = null, chatLog = [];

function deriveCases(entries){
  const groups = new Map();
  for(const e of entries){
    const cn = String(e.entities?.case_number || "").trim();
    const key = cn || ("__u__" + e.id);
    if(!groups.has(key)) groups.set(key, {number:cn, entries:[]});
    groups.get(key).entries.push(e);
  }
  return [...groups.values()].map(g => {
    const es = g.entries, first = es[0];
    const partyNames = new Map(), events = [], rep = [], topics = new Set(), courts = new Set(), relatedIds = new Set(), tags = new Set();
    for(const e of es){
      (e.parties || []).forEach(p => { if(p && p.name) partyNames.set(p.name, p.role || "other"); });
      (e.events || []).forEach(ev => events.push({...ev, entry:e}));
      (e.representation || []).forEach(r => { if(r && r.lawyer) rep.push(r); });
      (e.tags || []).forEach(t => t && tags.add(t));
      const ent = e.entities || {};
      if(ent.topic) topics.add(ent.topic);
      if(ent.court) courts.add(ent.court);
      (e.related_ids || []).forEach(id => relatedIds.add(id));
    }
    events.sort((a,b) => String(a.date).localeCompare(String(b.date)));
    return {
      id: g.number || first.id, number: g.number,
      title: first.title || first.summary?.slice(0,60) || "پرونده بدون عنوان",
      subject: [...topics][0] || "—", court: [...courts][0] || "—",
      entries: es,
      parties: [...partyNames].map(([name,role]) => ({name, role})),
      representation: rep, events, topics: [...topics], tags: [...tags],
      relatedIds: [...relatedIds], docIds: es.map(e => e.document_id).filter(Boolean),
      incomplete: !g.number || partyNames.size === 0,
      incompleteReasons: [!g.number && "شماره پرونده استخراج نشده", partyNames.size===0 && "طرفین استخراج نشده"].filter(Boolean),
      lastEventDate: events.length ? events[events.length-1].date : null,
      text: es.map(e => e.summary || e.title).join("\n"),
    };
  }).sort((a,b) => (b.entries.length - a.entries.length) || String(b.lastEventDate).localeCompare(String(a.lastEventDate)));
}

async function loadAll(force){
  S.loading = true; S.error = null;
  if(force) render();
  try{
    const [health, entries] = await Promise.all([ api("/health"), api("/entries") ]);
    S.health = health; S.entries = entries; S.cases = deriveCases(entries);
    try{ S.stats = await api("/stats"); }catch(_){ S.stats = null; }
    try{ const m = await api("/models"); S.models = m.models || []; S.modelCurrent = m.current; }catch(_){ S.models = []; }
    try{ const c = await api("/collections"); S.collections = c.collections || []; }catch(_){ S.collections = []; }
    try{ S.schema = await api("/schema"); }catch(_){ S.schema = null; }
    try{ S.facets = await api("/facets"); }catch(_){ S.facets = null; }
    S.error = null;
  }catch(err){ S.error = err.message; }
  S.loading = false;
  updateFoot(); paintModelSelect(); renderNav(); render();
}
function updateFoot(){
  const f = $("#sideFoot");
  if(S.error){ f.innerHTML = `<span class="bad">● قطع ارتباط با سرور</span>`; return; }
  if(!S.health){ f.textContent = "در حال اتصال…"; return; }
  const h = S.health;
  const chosen = CFG.model ? modelLabel(CFG.model) : (h.llm_model || h.llm_provider || "—");
  f.innerHTML = `<span class="ok">●</span> <span class="m">${esc(chosen)}</span><br>${faNum(h.indexed_documents)} سند · ${faNum(h.indexed_chunks)} قطعه`;
}
function modelLabel(id){ const m = S.models.find(x => x.id === id); return m ? m.label.replace(/\s+·\s+/g," · ") : id; }
const COLL_FA = {samples:"نمونه‌های دستی", rulings:"آرای دادگاه‌ها", "cases-en":"نمونه‌های انگلیسی", uploads:"افزوده‌شده"};
function collectionSelect(id){
  const opts = [`<option value="">همه مجموعه‌ها</option>`].concat(
    S.collections.map(c => `<option value="${esc(c.name)}">${esc(COLL_FA[c.name] || c.name)} (${faNum(c.documents)})</option>`));
  return `<select id="${id}" class="field" style="width:auto;padding:6px 8px;">${opts.join("")}</select>`;
}
const FACET_FA = {year:"سال", group:"گروه", doc_kind:"نوع سند", branch:"شعبه"};
function facetSelects(prefix){
  if(!S.facets) return "";
  return Object.entries(S.facets).filter(([,v]) => v && v.length).map(([key, vals]) =>
    `<select id="${prefix}-${key}" class="field" style="width:auto;padding:6px 8px;">
      <option value="">${esc(FACET_FA[key] || key)}: همه</option>
      ${vals.map(v => `<option value="${esc(v.value)}">${esc(FACET_FA[key])}: ${esc(v.value)} (${faNum(v.documents)})</option>`).join("")}
    </select>`).join("");
}
function readFacets(prefix){
  const f = {};
  Object.keys(S.facets || {}).forEach(key => {
    const v = $(`#${prefix}-${key}`)?.value;
    if(v) f[key] = v;
  });
  return Object.keys(f).length ? f : null;
}
function currentModelName(){ return CFG.model ? modelLabel(CFG.model) : (S.health?.llm_model || "پیش‌فرض سرور"); }
function paintModelSelect(){
  const sel = $("#modelSel"); if(!sel) return;
  const groups = {local:"مدل‌های محلی (Ollama)", openai:"ابری (9router)", anthropic:"Anthropic"};
  const byProv = {};
  for(const m of S.models){ (byProv[m.provider] ||= []).push(m); }
  let html = `<option value="">پیش‌فرض سرور${S.modelCurrent ? " — " + esc(modelLabel(S.modelCurrent)) : ""}</option>`;
  for(const prov of Object.keys(groups)){
    const list = byProv[prov]; if(!list || !list.length) continue;
    html += `<optgroup label="${groups[prov]}">` + list.map(m =>
      `<option value="${esc(m.id)}" ${m.available === false ? "disabled" : ""}>${esc(m.model)}${m.available === false ? " (بی‌کلید)" : ""}</option>`).join("") + `</optgroup>`;
  }
  sel.innerHTML = html; sel.value = CFG.model || "";
  const mp = $("#modelPick"); if(mp) mp.classList.toggle("busy", !S.models.length);
}

/* ===================== nav ===================== */
const NAV = [
  {id:"agent", n:"۰۱", label:"دستیار پرونده"},
  {id:"dashboard", n:"۰۲", label:"داشبورد"},
  {id:"cases", n:"۰۳", label:"پرونده‌ها"},
  {id:"events", n:"۰۴", label:"رویدادها"},
  {id:"ingest", n:"۰۵", label:"بایگانی سند جدید"},
  {id:"search", n:"۰۶", label:"جستجو و پرسش"},
  {id:"documents", n:"۰۷", label:"تیکت‌ها (اسناد)"},
  {id:"taxonomy", n:"۰۸", label:"طبقه‌بندی و برچسب‌ها"},
  {id:"review", n:"۰۹", label:"بازبینی انسانی", badge:() => S.cases.filter(c => c.incomplete).length},
  {id:"labeling", n:"۱۰", label:"برچسب‌گذاری و بازخورد"},
  {id:"analytics", n:"۱۱", label:"آمار آرشیو"},
  {id:"schema", n:"۱۲", label:"ساختار داده و خط لوله"},
];
function renderNav(){
  $("#navList").innerHTML = NAV.map(it => {
    const b = it.badge ? it.badge() : 0;
    const on = activeView === it.id || (activeView === "case-detail" && it.id === "cases");
    return `<div class="nav-item ${on ? "active" : ""}" onclick="goto('${it.id}')">
      <span class="n">${it.n}</span><span>${it.label}</span>${b > 0 ? `<span class="badge">${faNum(b)}</span>` : ""}</div>`;
  }).join("");
}
function goto(id){ activeView = id; if(id === "cases") taxFilter = null; window._openCase = null; render(); renderNav(); }
window.goto = goto;
function gotoCase(id, tab){ window._openCase = id; window._openTab = tab || "summary"; activeView = "case-detail"; render(); renderNav(); }
window.gotoCase = gotoCase;

/* ===================== render ===================== */
function render(){
  const root = mainRoot();
  if(S.loading && !S.entries){ root.innerHTML = `<div class="scroll-area"><div class="view"><div class="state"><span class="spinner"></span><div style="margin-top:12px;">در حال بارگذاری آرشیو…</div></div></div></div>`; return; }
  if(S.error && !S.entries){
    root.innerHTML = `<div class="scroll-area"><div class="view">
      <div class="err">خطا در ارتباط با سرور: ${esc(S.error)}</div>
      <div style="margin-top:14px;display:flex;gap:10px;">
        <button class="btn" onclick="loadAll(true)">تلاش دوباره</button>
        <button class="btn ghost" onclick="openSettings()">اتصال به سرور</button>
      </div></div></div>`;
    return;
  }
  if(activeView === "agent"){ renderAgent(); return; }
  const body = ({dashboard:tplDashboard, cases:tplCaseList, "case-detail":tplCaseDetail, events:tplEvents,
    ingest:tplIngest, search:tplSearch, documents:tplDocuments, taxonomy:tplTaxonomy, review:tplReview,
    labeling:tplLabeling, analytics:tplAnalytics, schema:tplSchema}[activeView] || tplDashboard)();
  root.innerHTML = `<div class="topbar">
      <div class="tb-search"><span>⌕</span><input id="globalSearch" placeholder="جستجو در پرونده‌ها…" value="${esc(searchTerm)}"></div>
      <div class="tb-right">
        <div class="model-pick" id="modelPick" title="مدل زبانی"><span class="lbl">مدل</span><select id="modelSel"></select></div>
        <button class="icon-btn" title="دستیار" onclick="goto('agent')">💬</button>
        <button class="icon-btn" title="اتصال به سرور" onclick="openSettings()">⚙</button>
        <button class="icon-btn" title="بازخوانی" onclick="loadAll(true)">⟳</button>
        <div class="avatar">ک.ح</div>
      </div>
    </div>
    <div class="scroll-area"><div class="view">${body}</div></div>`;
  wireTopbar();
  if(activeView === "case-detail" && (window._openTab || "summary") === "similar") setTimeout(loadSimilarInto, 30);
  if(activeView === "documents") setTimeout(loadDocsView, 20);
}
function wireTopbar(){
  paintModelSelect();
  $("#modelSel")?.addEventListener("change", e => { CFG.model = e.target.value; updateFoot(); render(); });
  $("#globalSearch")?.addEventListener("input", e => {
    searchTerm = e.target.value;
    if(activeView !== "cases"){ activeView = "cases"; renderNav(); }
    render();
    const g = $("#globalSearch"); if(g){ g.focus(); g.setSelectionRange(g.value.length, g.value.length); }
  });
}

/* ===================== agent chat ===================== */
let agentBusy = false;
function renderAgent(){
  mainRoot().innerHTML = `
  <div class="agent-wrap">
    <div class="agent-head">
      <div class="ah-left">
        <div class="ah-av">دس<span class="ah-dot ${agentBusy ? "busy" : "live"}" id="ahDot"></span></div>
        <div><div class="ah-name">دستیار پرونده</div><div class="ah-state" id="ahState">${agentBusy ? "در حال بررسی آرشیو…" : "آماده — بپرسید یا رویدادی را دیکته کنید"}</div></div>
      </div>
      <div class="tb-right">
        <div class="model-pick" id="modelPick" title="مدل زبانی"><span class="lbl">مدل</span><select id="modelSel"></select></div>
        <button class="icon-btn" title="نمای کلاسیک" onclick="goto('dashboard')">▤</button>
        <button class="icon-btn" title="اتصال به سرور" onclick="openSettings()">⚙</button>
      </div>
    </div>
    <div class="chat-scroll" id="chatScroll"><div class="chat-inner" id="chatInner"></div></div>
    <div class="suggestions" id="suggestions"></div>
    <div class="composer-wrap">
      <div class="rec-bar" id="recBar">
        <button class="rec-stop" onclick="stopMic()">■ پایان</button>
        <div class="rec-eq" id="recEq">${Array.from({length:28}).map(()=>'<i></i>').join("")}</div>
        <div class="rec-status" id="recStatus">در حال شنیدن…</div>
      </div>
      <div class="composer">
        <button class="cbtn mic" id="micBtn" title="ورودی صوتی — برای ضبط بزنید" onclick="toggleMic()">🎙️</button>
        <textarea id="chatInput" rows="1" placeholder="سؤال بپرسید، یا جلسه‌ای را برای بایگانی روایت کنید…" onkeydown="chatKey(event)"></textarea>
        <button class="cbtn send" onclick="sendChat()">➤</button>
      </div>

/* ---- interactive voice input: live level + voice-activity auto-stop ---- */
let _rec = null, _recChunks = [], _recCtx = null, _recRAF = 0, _recStream = null;
const SILENCE_MS = 1400;   // stop this long after speech ends
const MAX_MS = 90000;      // hard cap
function micState(t){ const s = $("#ahState"); if(s) s.textContent = t; }

window.toggleMic = async function(){
  if(_rec && _rec.state === "recording"){ stopMic(); return; }
  if(S.health && S.health.stt_available === false){ micState("رونویسی روی سرور فعال نیست (STT=0)."); return; }
  try{ _recStream = await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:true, noiseSuppression:true}}); }
  catch(_){ micState("دسترسی به میکروفون داده نشد."); return; }

  _recChunks = [];
  _rec = new MediaRecorder(_recStream);
  _rec.ondataavailable = e => { if(e.data.size) _recChunks.push(e.data); };
  _rec.onstop = onRecStop;

  // live analyser for the equalizer + voice-activity detection
  _recCtx = new (window.AudioContext || window.webkitAudioContext)();
  const src = _recCtx.createMediaStreamSource(_recStream);
  const an = _recCtx.createAnalyser(); an.fftSize = 512;
  src.connect(an);
  const buf = new Uint8Array(an.frequencyBinCount);
  const bars = [...document.querySelectorAll("#recEq i")];
  let spokeAt = 0, quietSince = 0;
  const started = performance.now();

  const loop = () => {
    an.getByteFrequencyData(buf);
    let sum = 0; for(let i=0;i<buf.length;i++) sum += buf[i]*buf[i];
    const rms = Math.sqrt(sum / buf.length) / 255;      // 0..1
    // equalizer
    bars.forEach((b,i) => {
      const v = buf[Math.floor(i/bars.length*buf.length)] / 255;
      b.style.height = Math.max(3, v*24) + "px";
    });
    const st = $("#recStatus"); const now = performance.now();
    if(rms > 0.06){ spokeAt = now; quietSince = 0;
      if(st){ st.textContent = "شما صحبت می‌کنید…"; st.className = "rec-status speaking"; } }
    else{
      if(!quietSince) quietSince = now;
      if(spokeAt && now - quietSince > SILENCE_MS){ stopMic(); return; }
      if(st){ st.textContent = spokeAt ? "سکوت — پایان خودکار…" : "در حال شنیدن…"; st.className = "rec-status " + (spokeAt?"silence":""); }
    }
    if(now - started > MAX_MS){ stopMic(); return; }
    _recRAF = requestAnimationFrame(loop);
  };

  _rec.start();
  $("#micBtn").classList.add("listening");
  $("#recBar").classList.add("on");
  micState("در حال ضبط — وقتی حرف زدنتان تمام شد خودکار متوقف می‌شود");
  _recRAF = requestAnimationFrame(loop);
};

window.stopMic = function(){
  if(_recRAF) cancelAnimationFrame(_recRAF), _recRAF = 0;
  if(_rec && _rec.state === "recording") _rec.stop();
};

async function onRecStop(){
  (_recStream ? _recStream.getTracks() : []).forEach(t => t.stop());
  if(_recCtx){ _recCtx.close(); _recCtx = null; }
  $("#micBtn").classList.remove("listening");
  $("#recBar").classList.remove("on");
  const blob = new Blob(_recChunks, {type: _rec.mimeType || "audio/webm"});
  if(blob.size < 1200){ micState("چیزی ضبط نشد — دوباره امتحان کنید."); return; }
  micState("در حال رونویسی…");
  try{
    const fd = new FormData(); fd.append("file", blob, "audio.webm");
    const headers = {}; if(CFG.token) headers["Authorization"] = "Bearer " + CFG.token;
    const r = await fetch(CFG.url + "/transcribe", {method:"POST", headers, body:fd});
    const j = await r.json();
    if(!r.ok) throw new Error(j.detail || r.statusText);
    const box = $("#chatInput");
    box.value = (box.value ? box.value.trim() + " " : "") + (j.text || "").trim();
    box.focus(); box.dispatchEvent(new Event("input"));
    micState(j.text ? `رونویسی شد · ${esc(j.model||"")} · ${faNum(j.duration||0)} ثانیه` : "گفتاری تشخیص داده نشد.");
  }catch(err){ micState("خطای رونویسی: " + err.message); }
}

async function sendChat(){
  const box = $("#chatInput"); const text = (box?.value || "").trim();
  if(!text || agentBusy) return;
  box.value = ""; box.style.height = "auto";
  chatLog.push({role:"user", text});
  agentBusy = true;
  const dot = $("#ahDot"); if(dot) dot.className = "ah-dot busy";
  const st = $("#ahState"); if(st) st.textContent = "در حال بررسی آرشیو…";
  $("#suggestions").innerHTML = "";
  renderChat();
  try{
    const j = await api("/assistant", {method:"POST", body: withModel({text})});
    j._query = text;
    chatLog.push(botMessageFor(j));
  }catch(err){
    chatLog.push({role:"bot", html:`<div class="err">خطا در ارتباط با سرور: ${esc(err.message)}</div>`});
  }
  agentBusy = false;
  if(dot) dot.className = "ah-dot live";
  if(st) st.textContent = "آماده — بپرسید یا رویدادی را دیکته کنید";
  renderChat();
}
window.sendChat = sendChat;

const INTENT_FA = {query:"پرسش از آرشیو", archive:"ثبت مدخل جدید", analytics:"آمار و تحلیل"};
function intentBadge(intent){

  return `<div class="intent-badge ${esc(intent)}">${icon} ${esc(INTENT_FA[intent] || intent)}</div>`;

function stepTrace(steps){
  if(!steps || !steps.length) return "";
  return `<details class="steps"><summary>مراحل انجام‌شده (${faNum(steps.length)})</summary>${
    steps.map((s,i) => `<div class="step"><div class="si">${faNum(i+1)}</div>
      <div><div class="sn">${esc(s.name)}</div><div class="sd">${esc(s.detail || "")}</div></div>
      <span class="sms">${faNum(s.ms||0)} م‌ث</span></div>`).join("")

}
function dGet(d, key){ return key.split(".").reduce((o,k) => (o && o[k] != null) ? o[k] : "", d); }

function fbButtons(query, chunkId){

    <button class="fb-b" title="مرتبط بود" onclick="sendFeedback(this,'${q}','${esc(chunkId)}','1')">👍</button>
    <button class="fb-b" title="نامرتبط بود" onclick="sendFeedback(this,'${q}','${esc(chunkId)}','0')">👎</button></span>`;
}
window.sendFeedback = async function(btn, query, chunkId, value){
  const wrap = btn.parentElement;
  wrap.querySelectorAll(".fb-b").forEach(b => b.classList.remove("on"));
  btn.classList.add("on");

function botMessageFor(j){
  const head = intentBadge(j.intent) + stepTrace(j.steps);

  if(j.intent === "query"){
    const ans = md(j.answer).replace(/\[(\d+)\]/g, (m,n) => `<span class="cite">${faNum(n)}</span>`);
    const ctx = (j.contexts || []).map(c =>
      `<div class="ctx-card"><div><span class="ctx-num">[${faNum(c.n)}]</span> <b>${esc(c.title || docBasename(c.source))}</b>
        <span class="ctx-src"> · ${esc(docBasename(c.source))} · شباهت ${faNum(Math.round(c.similarity*100))}٪</span>
        ${fbButtons(j._query, c.chunk_id)}</div>
        <div class="ctx-text">${esc(c.text)}</div></div>`).join("");
    return {role:"bot", wide:true, meta:`${j.model || ""} · ${faNum(Math.round(j.latency_ms||0))} م‌ث`,
      html:`${head}<div style="line-height:1.95;white-space:pre-wrap" dir="auto">${ans}</div>
        ${ctx ? `<div style="font-size:10px;color:var(--gray);margin-top:8px;">👍/👎 روی هر گزیده = آموزش سیستم برای بازیابی بهتر</div>${ctx}` : ""}`};
  }

  if(j.intent === "analytics"){
    const s = j.stats || {};
    const mini = (t, rows) => (rows && rows.length)
      ? `<div style="margin-top:8px;"><b style="font-size:12px;">${t}</b>${rows.slice(0,5).map(r => `<div class="list-row" style="padding:6px 0;"><span>${esc(r.name)}</span><span class="mono" style="color:var(--gray);">${faNum(r.count)}</span></div>`).join("")}</div>`
      : "";
    return {role:"bot", wide:true, meta:j.model || "",
      html:`${head}${j.summary ? `<div style="margin-bottom:10px;">${md(j.summary)}</div>` : ""}
        <div class="card-title">آمار آرشیو</div>
        <table class="ftable"><tr><td>اسناد</td><td class="mono">${faNum(s.documents)}</td></tr>
        <tr><td>مدخل ساختاریافته</td><td class="mono">${faNum(s.entries)}</td></tr>
        <tr><td>قطعه نمایه‌شده</td><td class="mono">${faNum(s.chunks)}</td></tr></table>
        ${mini("پرتکرارترین وکلا", s.lawyers)}${mini("موضوعات", s.topics)}`};
  }

  // archive — guided form
  const id = "dr" + Date.now();
  window["_draft_" + id] = j;
  const schema = j.schema || {fields:[]};
  return {role:"bot", wide:true, meta:"پیش‌نویس بایگانی — بررسی و تکمیل کنید",
    html:`${head}
      <div class="card-title">تشخیص: این یک جلسه/سند است. آنچه سیستم استخراج کرده را بررسی و در صورت نیاز اصلاح کنید.</div>
      <div style="font-size:10.6px;color:var(--gray);margin-bottom:10px;">${esc(schema.title || "")}</div>
      <div id="gf-${id}">${guidedFormFields(id, j.draft || {}, schema.fields || [])}</div>
      <div class="field-row" style="margin-top:10px;">
        <input id="src-${id}" class="field" style="flex:1;min-width:170px;" dir="ltr" placeholder="شناسهٔ منبع (اختیاری) — مثلاً jalase-1402-09-15">
        <button class="btn teal sm" onclick="commitChatDraft('${id}')">تایید و ثبت در آرشیو</button>
      </div>
      <div class="confirmed" id="ok-${id}">✓ در آرشیو ذخیره و نمایه شد.</div>`};
}

function guidedFormFields(id, draft, fields){
  return fields.map(f => {
    const v = dGet(draft, f.key);
    const missing = (f.type === "list" || f.type === "taglist") ? (!Array.isArray(v) || !v.length) : !v;
    const lbl = `<label>${esc(f.label)} ${missing ? '<span class="miss">— خالی</span>' : ""} <span class="help">${esc(f.help || "")}</span></label>`;
    const nm = `data-k="${esc(f.key)}" data-t="${esc(f.type)}"`;
    if(f.type === "choice"){
      return `<div class="gf-field"><label>${esc(f.label)}</label>
        <select ${nm}>${(f.options||[]).map(o => `<option ${o===v?"selected":""}>${esc(o)}</option>`).join("")}</select></div>`;
    }
    if(f.type === "taglist"){
      return `<div class="gf-field ${missing?"missing":""}">${lbl}
        <input ${nm} value="${esc((Array.isArray(v)?v:[]).join("، "))}" placeholder="با «،» جدا کنید"></div>`;
    }
    if(f.type === "list"){
      const cols = Object.entries(f.item || {});
      const roleOpts = f.roles ? Object.entries(f.roles) : null;
      const rows = (Array.isArray(v)?v:[]).map(item => gfListRow(cols, roleOpts, item)).join("");
      return `<div class="gf-field ${missing?"missing":""}">${lbl}
        <div class="gf-list" ${nm} data-cols='${esc(JSON.stringify(cols))}' data-roles='${esc(JSON.stringify(roleOpts))}'>${rows}</div>
        <button class="btn ghost sm" style="margin-top:4px;" onclick="gfAddRow(this)">+ افزودن</button></div>`;
    }
    return `<div class="gf-field ${missing?"missing":""}">${lbl}
      <textarea ${nm} rows="${f.key==='summary'?2:1}" dir="auto">${esc(v)}</textarea></div>`;
  }).join("");
}
function gfListRow(cols, roleOpts, item){
  item = item || {};
  return `<div class="gf-list-row">${cols.map(([k,label]) => {
    if(roleOpts && k === "role"){
      return `<select data-c="${esc(k)}">${roleOpts.map(([rk,rl]) => `<option value="${esc(rk)}" ${item[k]===rk?"selected":""}>${esc(rl)}</option>`).join("")}</select>`;
    }
    return `<input data-c="${esc(k)}" placeholder="${esc(label)}" value="${esc(item[k]||"")}">`;
  }).join("")}<button class="gf-x" onclick="this.parentElement.remove()">✕</button></div>`;
}
window.gfAddRow = function(btn){
  const wrap = btn.previousElementSibling;
  const cols = JSON.parse(wrap.dataset.cols || "[]");
  const roles = JSON.parse(wrap.dataset.roles || "null");
  wrap.insertAdjacentHTML("beforeend", gfListRow(cols, roles, {}));
};

function readGuidedForm(id){
  const draft = {entities:{}};
  document.querySelectorAll(`#gf-${id} [data-k]`).forEach(el => {
    const key = el.dataset.k, type = el.dataset.t;
    let val;
    if(type === "list"){
      val = [...el.querySelectorAll(".gf-list-row")].map(row => {
        const o = {};
        row.querySelectorAll("[data-c]").forEach(c => { if(c.value.trim()) o[c.dataset.c] = c.value.trim(); });
        return o;
      }).filter(o => Object.keys(o).length);
    } else if(type === "taglist"){
      val = el.value.split(/[،,]/).map(s => s.trim()).filter(Boolean);
    } else {
      val = el.value.trim();
    }
    if(key.includes(".")){ const [, sub] = key.split("."); draft.entities[sub] = val; }
    else draft[key] = val;
  });
  draft.kind = draft.kind || "session";
  return draft;
}

window.commitChatDraft = async function(id){
  const j = window["_draft_" + id]; if(!j) return;
  const draft = readGuidedForm(id);
  const src = (document.getElementById("src-" + id)?.value || "").trim() || ("ui/" + (draft.entities?.case_number || Date.now()));
  try{
    await api("/assistant/commit", {method:"POST", body:{draft, raw_text:j.raw_text, source:src}});
    document.getElementById("ok-" + id)?.classList.add("show");
    loadAll();
  }catch(err){ alert("خطا در ذخیره: " + err.message); }
};

  $("#ingestModalBody").innerHTML = PIPE.map((s,i) => `<div class="pipe-step ${i===0?'active':''}" id="ps-${i}"><div class="pipe-icon">${i+1}</div><div class="pipe-label">${s.label}</div></div>`).join("") + `<div id="ingestResult" style="margin-top:14px;"></div>`;

/* ===================== taxonomy ===================== */
function tplTaxonomy(){
  const topics = {}, tags = {};
  for(const c of S.cases){
    c.topics.forEach(t => topics[t] = (topics[t]||0) + 1);
    c.tags.forEach(t => tags[t] = (tags[t]||0) + 1);
  }
  const sortEnt = o => Object.entries(o).sort((a,b) => b[1]-a[1]);
  const leaf = ([name,n]) => `<span class="tax-leaf" onclick="taxFilter='${esc(name)}';activeView='cases';render();renderNav();">${esc(name)} <span class="cnt">${faNum(n)}</span></span>`;
  return `
    <div class="view-head"><div><div class="view-title">طبقه‌بندی و برچسب‌ها</div>
      <div class="view-sub">موضوعات و برچسب‌های استخراج‌شده از مدخل‌ها — روی هر مورد بزنید تا پرونده‌های آن فیلتر شوند</div></div></div>
    <div class="panel"><div class="panel-body" style="padding-top:14px;">
      <div class="tax-cat"><div class="tax-name">موضوعِ دعوا <span class="mono">${faNum(sortEnt(topics).length)} دسته</span></div>
        ${sortEnt(topics).map(leaf).join("") || `<span style="color:var(--gray);">—</span>`}</div>
      <div class="tax-cat"><div class="tax-name">برچسب‌ها <span class="mono">${faNum(sortEnt(tags).length)} برچسب</span></div>
        ${sortEnt(tags).map(leaf).join("") || `<span style="color:var(--gray);">—</span>`}</div>
    </div></div>
    <div class="soon">طبقه‌بندی سلسله‌مراتبی (حقوقی › ملک › تخلیه) و «کاندیدای دسته جدید» نیازمند یک تاکسونومی ذخیره‌شده در سرور است. فعلاً برچسب‌ها تخت‌اند.</div>`;
}

function ticketNo(d){
  const cn = d.metadata?.case_number;
  if(cn) return cn;
  const m = String(d.source||"").match(/(\d{3,})/);
  return m ? "T-" + m[1] : "T-" + String(d.id).slice(0,6);
}

window.docApplyFilters = function(){
  DOCS.q = ($("#docSearch")?.value || "").trim();
  DOCS.filters = { collection: $("#docColl")?.value || "", ...readFacets("df") };
  DOCS.offset = 0; docFetch();
};
window.docClearFilters = function(){
  ["#docSearch"].forEach(s => { if($(s)) $(s).value = ""; });
  document.querySelectorAll('[id^="df-"], #docColl').forEach(s => s.value = "");
  DOCS.q = ""; DOCS.filters = {}; DOCS.offset = 0; docFetch();
};
async function docPage(dir){
  DOCS.offset = Math.max(0, DOCS.offset + dir * DOCS.limit);
  if(DOCS.offset >= DOCS.total) DOCS.offset = Math.max(0, DOCS.total - DOCS.limit);
  await docFetch();
}
window.docPage = docPage;
async function docFetch(){
  const tb = $("#docTbody");
  if(tb) tb.innerHTML = `<tr><td colspan="6"><div class="state"><span class="spinner"></span></div></td></tr>`;
  try{
    const p = new URLSearchParams({limit:DOCS.limit, offset:DOCS.offset});
    if(DOCS.q) p.set("q", DOCS.q);
    Object.entries(DOCS.filters || {}).forEach(([k,v]) => { if(v) p.set(k, v); });
    const res = await api("/documents?" + p.toString());
    DOCS.items = res.items || []; DOCS.total = res.total || 0;
    paintDocs();
  }catch(err){ if(tb) tb.innerHTML = `<tr><td colspan="6"><div class="err">${esc(err.message)}</div></td></tr>`; }
}
function paintDocs(){
  const tb = $("#docTbody"); if(!tb) return;
  tb.innerHTML = DOCS.items.length ? DOCS.items.map(d => {
    const m = d.metadata || {};
    const st = m.status || "";
    const badges = [m.year, m.group, m.doc_kind, m.court].filter(Boolean)
      .map(x => `<span class="chip" style="cursor:default;">${esc(x)}</span>`).join(" ");
    return `<tr class="row-hover" onclick="openDoc('${esc(d.id)}')">
      <td class="mono" style="font-size:11px;">${esc(ticketNo(d))}</td>
      <td style="font-weight:600;max-width:280px;">${esc(d.title || "—")}
        <div class="case-sub">${esc(docBasename(d.source))}</div></td>
      <td><span class="stamp ${STATUS_CLS[st] || "gray"}"><span class="dotc"></span>${esc(STATUS_FA[st] || st || "بدون وضعیت")}</span></td>
      <td>${(m.tags||[]).map(t => `<span class="chip" style="cursor:default;">${esc(t)}</span>`).join(" ") || "<span style='color:var(--gray)'>—</span>"}</td>
      <td style="font-size:10.5px;">${badges || "<span style='color:var(--gray)'>—</span>"}</td>
      <td>${faNum(d.chunks)}</td>
    </tr>`;
  }).join("") : `<tr><td colspan="6"><div class="state">تیکتی مطابق فیلتر یافت نشد.</div></td></tr>`;
  const c = $("#docCount"); if(c) c.textContent = `${faNum(DOCS.total)} تیکت`;
  const info = $("#docPageInfo");
  if(info){ const from = DOCS.total ? DOCS.offset + 1 : 0; info.textContent = `${faNum(from)}–${faNum(Math.min(DOCS.offset + DOCS.limit, DOCS.total))} از ${faNum(DOCS.total)}`; }
  const prev = $("#docPrev"), next = $("#docNext");
  if(prev) prev.disabled = DOCS.offset === 0;
  if(next) next.disabled = DOCS.offset + DOCS.limit >= DOCS.total;
}

async function _patchDoc(id, body){
  const d = await api("/documents/" + id + "/meta", {method:"PATCH", body});

}

    ${pipe("query", "🔍 پرسش از آرشیو", s.pipeline.query)}
    ${pipe("archive", "📝 ثبت مدخل جدید", s.pipeline.archive)}
    ${pipe("analytics", "📊 آمار و تحلیل", s.pipeline.analytics)}
    <div class="soon">دستیار هر پیام را به یکی از این سه مسیر می‌فرستد. در نمای «دستیار پرونده»، هر پاسخ نشان می‌دهد کدام مسیر و کدام مراحل اجرا شده‌اند.</div>`;
}

/* ===================== analytics ===================== */
function tplAnalytics(){
  const st = S.stats;
  return `
    <div class="view-head"><div><div class="view-title">آمار آرشیو</div>
      <div class="view-sub">تحلیل توصیفی بر پایه مدخل‌های ساختاریافته</div></div></div>
    <div class="ledger-grid">
      <div class="ledger-card"><div class="num">${faNum(st?.documents)}</div><div class="lbl">سند</div></div>
      <div class="ledger-card"><div class="num">${faNum(st?.entries)}</div><div class="lbl">مدخل ساختاریافته</div></div>
      <div class="ledger-card accent-teal"><div class="num">${faNum(st?.chunks)}</div><div class="lbl">قطعه نمایه‌شده</div></div>
      <div class="ledger-card accent-amber"><div class="num">${faNum(S.cases.length)}</div><div class="lbl">پرونده</div></div>
    </div>
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:16px;">
      ${statList("پرتکرارترین وکلا", st?.lawyers)}${statList("موضوعات", st?.topics)}
      ${statList("اشخاص", st?.people)}${statList("سازمان‌ها", st?.orgs)}
    </div>
    <div class="panel"><div class="panel-head"><h3>پرسش آماری آزاد</h3><span class="sub">مدل: ${esc(currentModelName())}</span></div>
      <div class="panel-body" style="padding-top:14px;">
        <input class="field" id="anaQ" placeholder="مثال: چند پرونده کیفری داریم و رضا کریمی وکیل چه کسانی بوده؟" onkeydown="if(event.key==='Enter')doAnalyticsAsk()">
        <div class="field-row" style="justify-content:flex-end;"><button class="btn sm" onclick="doAnalyticsAsk()">پرسش</button></div>
        <div id="anaResult"></div>
      </div></div>`;
}
function statList(title, rows){
  return `<div class="panel"><div class="panel-head"><h3>${title}</h3></div>
    <div class="panel-body">${(rows||[]).length ? rows.map(r => `<div class="list-row"><span>${esc(r.name)}</span><span class="mono" style="color:var(--gray);">${faNum(r.count)}</span></div>`).join("") : `<div class="state">داده‌ای نیست.</div>`}</div></div>`;
}
async function doAnalyticsAsk(){
  const q = ($("#anaQ")?.value || "").trim(); if(!q) return;
  const box = $("#anaResult"); box.innerHTML = `<div class="state"><span class="spinner"></span></div>`;
  try{
    const res = await api("/assistant", {method:"POST", body: withModel({text:q, intent:"analytics"})});
    box.innerHTML = `<div class="answer" style="margin-top:12px;">${md(res.summary || "پاسخی تولید نشد.")}</div>`;
  }catch(err){ box.innerHTML = `<div class="err">${esc(err.message)}</div>`; }
}
window.doAnalyticsAsk = doAnalyticsAsk;

/* ===================== settings + overlays ===================== */
function openSettings(){
  $("#cfgUrl").value = (function(){ try{ return localStorage.getItem("rag.url") || location.origin; }catch(e){ return location.origin; } })();
  $("#cfgToken").value = CFG.token; $("#cfgMsg").textContent = "";
  $("#settingsOverlay").classList.add("show");
}
window.openSettings = openSettings;
function closeOverlay(id){ $("#" + id).classList.remove("show"); }
window.closeOverlay = closeOverlay;
async function saveSettings(){
  CFG.save($("#cfgUrl").value.trim(), $("#cfgToken").value.trim());
  $("#cfgMsg").textContent = "در حال بررسی…";
  try{ await api("/health"); $("#cfgMsg").textContent = "متصل شد ✓"; setTimeout(() => { closeOverlay("settingsOverlay"); loadAll(true); }, 500); }
  catch(err){ $("#cfgMsg").innerHTML = `<span style="color:var(--stamp-red);">${esc(err.message)}</span>`; }
}
window.saveSettings = saveSettings;

/* init */
renderNav();
loadAll();
</script>
</body>
</html>
