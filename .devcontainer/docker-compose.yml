# The dev environment: a Python container to work in, and a real Postgres with
# pgvector beside it. Codespaces starts both and drops you into `app`.
services:
  app:
    image: mcr.microsoft.com/devcontainers/python:3.12-bookworm
    volumes:
      - ..:/workspace:cached
      # Model cache survives container rebuilds — a fresh download is ~271 MB.
      - fastembed-cache:/home/vscode/.cache/fastembed
    command: sleep infinity
    depends_on:
      db:
        condition: service_healthy

  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: postgres
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 3s
      timeout: 3s
      retries: 20

volumes:
  pgdata:
  fastembed-cache:
