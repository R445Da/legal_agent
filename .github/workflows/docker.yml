# Build the cloud image on every push, for both architectures, and publish it
# to this repo's container registry.
#
# Why both arches: Oracle's free tier is ARM64 and Hugging Face Spaces is x86.
# One build produces a manifest that serves the right one to each.
#
# The published image needs no secrets — DATABASE_URL and the model key are
# supplied at run time, never baked in.
name: docker

on:
  push:
    branches: ["**"]
    paths:
      - "app/**"
      - "scripts/**"
      - "streamlit_app.py"
      - "docker/**"
      - ".github/workflows/docker.yml"
  pull_request:
  workflow_dispatch:

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3        # lets x86 runners emit ARM64
      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=ref,event=branch
            type=sha,format=short
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          file: docker/Dockerfile.cloud
          # A PR builds x86 only — an emulated ARM build takes ~20 minutes and
          # a pull request does not need a publishable artifact.
          platforms: ${{ github.event_name == 'pull_request' && 'linux/amd64' || 'linux/amd64,linux/arm64' }}
          # Models are ~1.4 GB and would be re-downloaded on every cache miss.
          # CI proves the image builds; the deploy host bakes them for real.
          build-args: BAKE_MODELS=0
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  smoke:
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The one thing worth asserting in CI: the image refuses to start without
      # a database rather than coming up broken.
      - name: Image refuses a missing DATABASE_URL
        run: |
          docker build -f docker/Dockerfile.cloud --build-arg BAKE_MODELS=0 -t test .
          out=$(docker run --rm test 2>&1 || true)
          echo "$out"
          echo "$out" | grep -q "DATABASE_URL is unset" \
            || { echo "::error::image did not refuse a missing DATABASE_URL"; exit 1; }
