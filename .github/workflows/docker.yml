# Test the app against a real pgvector Postgres, then build the cloud image
# for both architectures and publish it to this repo's container registry.
#
# Why both arches: Oracle's free tier is ARM64 and Hugging Face Spaces is x86.
# One build produces a manifest that serves the right one to each.
#
# Nothing here needs a secret. The tests run on the offline mock model, and
# the published image takes DATABASE_URL and the model key at run time.
name: docker

on:
  push:
    branches: ["**"]
    paths:
      - "app/**"
      - "scripts/**"
      - "data/laws/**"
      - "streamlit_app.py"
      - "docker/**"
      - ".dockerignore"                # decides what reaches the image
      - ".github/workflows/docker.yml"
  pull_request:
  workflow_dispatch:

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  test:
    # The same shape as Codespaces, Supabase and Neon: pgvector in its own
    # container, the app talking to it over DATABASE_URL, no pgserver.
    runs-on: ubuntu-latest
    permissions:
      contents: read
    services:
      db:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 3s
          --health-timeout 3s
          --health-retries 20
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres
      PGPASSWORD: postgres
      LLM_PROVIDER: mock
      LLM_MODEL: rules-v1
      ROUTER_MODEL: mock::rules-v1
      EMBEDDING_MODEL: hash://384      # deterministic, no model download
      EMBEDDING_DIM: "384"
      EMBEDDING_PREFIXES: "0"
      HYBRID: "1"
      RERANK: "0"
      TS_CONFIG: simple
      STT: "0"
      API_TOKEN: citoken
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: docker/requirements-cloud.txt

      - run: pip install -r docker/requirements-cloud.txt

      # docker/seed.dump is a PG 16 custom archive (format 1.15); an older
      # pg_restore refuses it outright.
      - name: PostgreSQL 16 client
        run: |
          if ! pg_restore --version | grep -qE ' (1[6-9]|[2-9][0-9])\.'; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq postgresql-client-16
          fi
          pg_restore --version

      - name: Insurance edition seeds into an empty pgvector database
        run: |
          python -m scripts.seed_mock --reset --n 40
          n=$(psql "$DATABASE_URL" -tAc 'select count(*) from legal_cases')
          [ "$n" = "40" ] || { echo "::error::expected 40 cases, got $n"; exit 1; }

      - name: Every API endpoint answers (scripts/check.sh)
        run: |
          uvicorn app.main:app --host 127.0.0.1 --port 8000 > api.log 2>&1 &
          for _ in $(seq 1 60); do
            curl -sf -o /dev/null http://127.0.0.1:8000/health && break
            sleep 1
          done
          BASE=http://127.0.0.1:8000 scripts/check.sh || { cat api.log; exit 1; }

      - name: Every UI section renders (scripts/ui_smoke.py)
        run: python -m scripts.ui_smoke

      # The path Codespaces takes: the packaged archive into a fresh database,
      # then the migrations the dump predates. The dump's vectors carry the
      # MiniLM fingerprint, so those settings are used here; the guard only
      # compares strings, nothing is downloaded.
      - name: The packaged archive restores and migrates
        env:
          EMBEDDING_MODEL: sentence-transformers/paraphrase-multilingual-MiniLM-L12-v2
        run: |
          createdb -h localhost -U postgres archive
          url=postgresql://postgres:postgres@localhost:5432/archive
          psql -q "$url" -c 'CREATE EXTENSION IF NOT EXISTS vector'
          pg_restore --no-owner --no-privileges --dbname "$url" docker/seed.dump
          DATABASE_URL="$url" python -m scripts.migrate_fts
          DATABASE_URL="$url" python -m scripts.migrate_runs
          n=$(psql "$url" -tAc 'select count(*) from documents')
          [ "$n" = "806" ] || { echo "::error::expected 806 documents, got $n"; exit 1; }
          cols=$(psql "$url" -tAc "select count(*) from information_schema.columns
                 where table_name='entries' and column_name in ('related','legal_refs','case_id','text_search')")
          [ "$cols" = "4" ] || { echo "::error::entries is missing upgraded columns ($cols/4)"; exit 1; }

  build:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3        # lets x86 runners emit ARM64
      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=ref,event=branch
            type=sha,format=short
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          file: docker/Dockerfile.cloud
          # A PR builds x86 only — an emulated ARM build takes ~20 minutes and
          # a pull request does not need a publishable artifact.
          platforms: ${{ github.event_name == 'pull_request' && 'linux/amd64' || 'linux/amd64,linux/arm64' }}
          # Models are ~1.4 GB and would be re-downloaded on every cache miss.
          # CI proves the image builds; the deploy host bakes them for real.
          build-args: BAKE_MODELS=0
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  smoke:
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The one thing worth asserting in CI: the image refuses to start without
      # a database rather than coming up broken.
      - name: Image refuses a missing DATABASE_URL
        run: |
          docker build -f docker/Dockerfile.cloud --build-arg BAKE_MODELS=0 -t test .
          out=$(docker run --rm test 2>&1 || true)
          echo "$out"
          echo "$out" | grep -q "DATABASE_URL is unset" \
            || { echo "::error::image did not refuse a missing DATABASE_URL"; exit 1; }
