line-length = 120
target-version = "py312"
extend-exclude = ["docs", "data", ".venv", ".pgdata*", "legal-archive-*.html"]

[lint]
# Ruff's defaults (pyflakes + the pycodestyle errors that matter). Style-only
# rules stay off so the existing code is not rewritten for the linter's sake:
# E741 single-letter names, E402 imports after load_dotenv(), E702 one-line
# constant tables.
select = ["E4", "E7", "E9", "F"]
ignore = ["E741", "E402", "E702"]
